&lt;script id=&quot;brgm-model&quot;&gt;
/*
 * Independent educational implementation. Not BRGM software or a calibrated forecast.
 * Source: Bernardie et al., Landslides 12, 481–494 (2015), online 27 May 2014.
 * DOI: 10.1007/s10346-014-0495-8. Mechanical MA model, equations 5–11, Table 2.
 * Fixed paper values: alpha=25 deg, c=14 kPa, h=9 m, d=0.2 m, g=10 m/s².
 * Illustrative choices within Table 2 ranges: unit weight=20 kN/m³,
 * friction=28 deg, porosity=0.08, viscosity=1e10 Pa.s; no fitted parameters.
 * Note: Table 2 labels 16–24 kN/m³ as rho; these units are a unit weight.
 * We use gamma_s=20000 N/m³ and mass density rho=gamma_s/g=2000 kg/m³.
 * h and z are vertical thicknesses; normal stress=gamma_s*h*cos²(alpha),
 * shear stress=gamma_s*h*sin(alpha)*cos(alpha), p=gamma_w*z*cos²(alpha).
 * Continuous reservoir adaptation of eqs 6–11:
 * dz/dt = I_eff/n - (z-z_base)/T_v, with t in days, I_eff in m/day.
 * z_base=4 m, initial level and constant-intensity rainfall are OUR scenario choices.
 * Reservoir integrated exactly on each 0.05-day step. A cap at z=h exports excess
 * water; it is an added physical boundary, not an equation claimed from the paper.
 * Quasi-static limit of eq 5: v=max(0, tau-c-(sigma_n-p)*tan(phi))*d/eta.
 * Mechanical relaxation rho*h*d/eta=3.6e-7 s; inertia is negligible at this scale.
 * Velocity converted from m/s to mm/day; displacement integrated by trapezoids.
 * No snow module, source recharge, statistical IR/IRMA calibration, changing
 * rheology, observed Super-Sauze series, fluidization, or spatial runout model.
 */
var BRGMModel = (() =&gt; {
  const constants = Object.freeze({alpha:25, cohesion:14000, h:9, d:0.2, g:10, gamma:20000, gammaWater:10000, porosity:0.08, friction:28, viscosity:1e10, base:4, days:90, onset:10});
  function simulate(input = {}, step = 0.05) {
    const p = Object.assign({rain:180, duration:6, drain:30, initial:5, viscosity:constants.viscosity}, input);
    const c=constants, a=c.alpha*Math.PI/180, phi=c.friction*Math.PI/180;
    if (!(p.rain&gt;=0 &amp;&amp; p.duration&gt;0 &amp;&amp; p.drain&gt;0 &amp;&amp; p.viscosity&gt;0 &amp;&amp; p.initial&gt;=c.base &amp;&amp; p.initial&lt;=c.h &amp;&amp; step&gt;0)) throw new Error(&#x27;Paramètres physiques invalides&#x27;);
    const cs=Math.cos(a), tau=c.gamma*c.h*Math.sin(a)*cs, normal=c.gamma*c.h*cs*cs;
    const pressurePerMeter=c.gammaWater*cs*cs, critical=(normal-(tau-c.cohesion)/Math.tan(phi))/pressurePerMeter;
    const speed=z=&gt;Math.max(0,tau-c.cohesion-(normal-pressurePerMeter*z)*Math.tan(phi))*c.d/p.viscosity*86400*1000;
    const intensity=p.rain/p.duration, rainfall=t=&gt;(t&gt;=c.onset &amp;&amp; t&lt;c.onset+p.duration ? intensity : 0);
    let z=p.initial, displacement=0, supplied=0, drained=0, overflow=0, peak=speed(z), movingDays=0;
    const data=[{t:0,rain:rainfall(0),z,v:speed(z),s:0}];
    const nsteps=Math.round(c.days/step), dt=c.days/nsteps;
    for(let i=1;i&lt;=nsteps;i++) {
      const t=i*dt, left=(i-1)*dt;
      const wet=Math.max(0,Math.min(t,c.onset+p.duration)-Math.max(left,c.onset));
      const I=rainfall(left+dt/2)/1000;
      const x0=z-c.base, xEq=I/c.porosity*p.drain, factor=-Math.expm1(-dt/p.drain);
      const raw=c.base+x0+(xEq-x0)*factor;
      const next=Math.min(c.h,Math.max(c.base,raw));
      const discharge=c.porosity/p.drain*(x0*p.drain*factor+xEq*(dt-p.drain*factor));
      supplied+=I*dt; drained+=discharge; overflow+=Math.max(0,raw-c.h)*c.porosity;
      const previous=speed(z), current=speed(next);
      displacement+=(previous+current)*dt/2;
      movingDays+=(Number(previous&gt;1e-9)+Number(current&gt;1e-9))*dt/2;
      z=next; peak=Math.max(peak,current);
      data.push({t,rain:rainfall(t),z,v:current,s:displacement});
    }
    return {data, params:p, critical, peak, displacement, movingDays, waterBalanceError:supplied-drained-overflow-c.porosity*(z-p.initial), rainfallTotal:supplied*1000, overflow:overflow*1000, relaxationSeconds:(c.gamma/c.g)*c.h*c.d/p.viscosity};
  }
  return {constants,simulate};
})();

  const icon = (svg, className = "visualization-share-icon") => {

      new DOMParser().parseFromString(svg, "image/svg+xml").documentElement,
      true,

    node.setAttribute("class", className);
    node.setAttribute("aria-hidden", "true");
    node.setAttribute("focusable", "false");

  document.body.classList.add("visualization-share-page");
  const brand = element("header", "visualization-share-brand");
  const home = link("https://chatgpt.com/");
  home.setAttribute("aria-label", "ChatGPT");
  home.append(icon(icons.wordmark, "visualization-share-wordmark"));
  brand.append(home);
  const main = element("main", "visualization-share-main");
  const article = element("article", "visualization-share-object");
  const card = element("div", "visualization-share-card");
  const chart = element(
    "section",
    "visualization-share-face visualization-share-chart",
  );
  chart.id = "visualization-share-chart";
  chart.setAttribute("aria-label", frame.title);
  chart.setAttribute("aria-hidden", "false");
  const content = element("div", "visualization-share-content");
  content.append(frame);
  chart.append(content);
  card.append(chart);

  const footer = element("footer", "visualization-share-footer");
  const attribution = element("p", "visualization-share-attribution");
  const authorName =
    typeof metadata.authorName === "string" ? metadata.authorName : "";
  const attributionLabel = authorName ? labels.madeBy : labels.madeWith;
  for (const part of attributionLabel.split(/(\{visualize\})/)) {
    if (part === "{visualize}") {
      const growth = link(
        "https://chatgpt.com/?prompt=%40visualize",
        "Visualize",
        "visualization-share-growth",
      );
      growth.prepend(icon(icons.visualize, "visualization-share-logo"));
      attribution.append(growth);
    } else if (part.trim()) {
      attribution.append(
        element(
          "span",
          "",
          part.replaceAll("{author}", () => authorName).trim(),
        ),
      );
    }
  }
  footer.append(attribution);
  const sources = Array.isArray(metadata.sources) ? metadata.sources : [];
  if (sources.length > 0) {
    const panel = element(
      "section",
      "visualization-share-face visualization-share-sources",
    );
    panel.id = "visualization-share-sources";
    panel.inert = true;
    panel.setAttribute("aria-hidden", "true");

    const heading = element("h2", "", labels.sources);
    heading.id = "visualization-share-sources-heading";
    panel.setAttribute("aria-labelledby", heading.id);
    header.append(heading);
    sourceContent.append(header);
    for (const source of sources) {
      if (typeof source.title !== "string") {
        continue;
      }
      const row = element("details", "visualization-share-source");
      const summary = element("summary");
      const documentIcon = element("span", "visualization-share-source-icon");
      const type =
        typeof source.type === "string" ? source.type.toLowerCase() : "";
      let sourceIcon = icons.document;
      if (type === "saved query" || type === "query" || type === "code") {
        sourceIcon = icons.code;
      } else if (
        type === "dataset" ||
        type === "table" ||
        type === "spreadsheet"
      ) {
        sourceIcon = icons.table;
      }
      documentIcon.append(icon(sourceIcon));
      const text = element("span", "visualization-share-source-heading");
      text.append(
        element("span", "visualization-share-source-title", source.title),
      );
      const context = [source.provider, source.type, source.date]
        .filter((value) => typeof value === "string" && value.length > 0)
        .join(" · ");
      if (context) {
        text.append(
          element("span", "visualization-share-source-context", context),
        );
      }
      summary.append(
        documentIcon,
        text,
        icon(icons.chevron, "visualization-share-chevron"),
      );
      row.append(summary);
      if (typeof source.description === "string" && source.description) {
        row.append(
          element(
            "p",
            "visualization-share-source-description",
            source.description,
          ),
        );
      }
      const url = safeUrl(source.url);
      if (url != null) {
        row.append(
          link(url, labels.openSource, "visualization-share-source-link"),
        );
      }
      sourceContent.append(row);
    }
    panel.append(sourceContent);
    card.append(panel);
    const showSources = element(
      "button",
      "visualization-share-toggle",
      labels.sources,
    );
    showSources.type = "button";
    showSources.setAttribute("aria-controls", panel.id);
    showSources.setAttribute("aria-expanded", "false");
    showSources.prepend(icon(icons.sources));
    const showChart = element(
      "button",
      "visualization-share-toggle",
      labels.backToChart,
    );
    showChart.type = "button";
    showChart.setAttribute("aria-controls", chart.id);
    showChart.hidden = true;
    showChart.prepend(icon(icons.back));
    const flip = (show) => {
      // Both faces stay laid out in the same grid cell. A synthetic resize would
      // clear the live iframe's measured height and move the card mid-transition.
      card.classList.toggle("visualization-share-flipped", show);
      showSources.hidden = show;
      showChart.hidden = !show;
      chart.inert = show;
      panel.inert = !show;
      chart.setAttribute("aria-hidden", String(show));
      panel.setAttribute("aria-hidden", String(!show));
      showSources.setAttribute("aria-expanded", String(show));
      (show ? showChart : showSources).focus({ preventScroll: true });
    };
    showSources.addEventListener("click", () => flip(true));
    showChart.addEventListener("click", () => flip(false));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && chart.inert) {
        event.preventDefault();
        flip(false);
      }
    });
    const controls = element("div", "visualization-share-controls");
    controls.append(showSources, showChart);
    footer.append(controls);
  }
  article.append(card, footer);
  main.append(article);
  document.body.prepend(brand, main);
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;

    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };

  let state = null;

    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }

      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
